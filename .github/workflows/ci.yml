name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linechatbot
          POSTGRES_PASSWORD: linechatbot
          POSTGRES_DB: linechatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linechatbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://linechatbot:linechatbot@localhost:5432/linechatbot_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter api db:migrate
      - run: pnpm --filter api test:e2e
      - run: pnpm build
      - run: pnpm audit --audit-level=high
